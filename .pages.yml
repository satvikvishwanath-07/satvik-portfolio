
media:
  input: media
  output: /media

content:
  - name: portfolio
    label: Portfolio Content
    type: file
    path: content.json
    format: json
    fields:
      - name: name
        label: Full Name
        type: string
      - name: headline
        label: Headline
        type: string
      - name: about
        label: About Me
        type: text
      - name: education
        label: Education
        type: text
      - name: interests
        label: Career Interests
        type: text
      - name: email
        label: Email
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - name: title
            label: Project Title
            type: string
          - name: description
            label: Description
            type: text
          - name: tools
            label: Tools Used
            type: string
          - name: outcome
            label: Outcome
            type: text
      - name: skills
        label: Skills
        type: string
        list: true
      - name: certifications
        label: Certifications
        type: string
        list: true
      - name: experience
        label: Experience
        type: text
      - name: resume
        label: Resume URL
        type: string
